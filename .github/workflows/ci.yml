name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.config }}, ${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        arch: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Activates MSVC environment (cl.exe, link.exe, etc.) for the target arch.
      # Uses vswhere internally — works with any installed VS version.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # Cache CMake FetchContent downloads (_deps).
      # Key is tied to CMakeLists.txt hash — auto-invalidates on dependency changes.
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build-ci-${{ matrix.arch }}/_deps
          key: cmake-deps-${{ matrix.arch }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-${{ matrix.arch }}-

      - name: Configure CMake
        run: cmake --preset ci-${{ matrix.arch }}-tests

      - name: Build
        run: cmake --build build-ci-${{ matrix.arch }} --config ${{ matrix.config }}

      - name: Test
        run: ctest --test-dir build-ci-${{ matrix.arch }} -C ${{ matrix.config }} --output-on-failure
